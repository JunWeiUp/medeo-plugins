<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="style.css"><title>Pinned Screenshot</title></head>
<body data-page="pin" class="pin-page">
<div id="pin-wrap" class="pin-wrap" data-testid="screenshot.pin">
  <img id="pin-img" class="pin-img" alt="" draggable="false">
  <div class="pin-bar">
    <span id="pin-opacity" class="pin-badge">100%</span>
    <button id="pin-copy" class="pin-btn" data-testid="screenshot.pin.copy"></button>
    <button id="pin-save" class="pin-btn" data-testid="screenshot.pin.save"></button>
    <button id="pin-close" class="pin-btn danger" data-testid="screenshot.pin.close"></button>
  </div>
</div>
<script src="index.js" type="module"></script></body></html>
