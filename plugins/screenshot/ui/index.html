<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="style.css"><title>Screenshot</title></head>
<body data-page="overlay" class="overlay">
<canvas id="base"></canvas><canvas id="ann"></canvas><canvas id="ui" data-testid="screenshot.canvas"></canvas>
<div id="tools" class="bar tools" data-testid="screenshot.toolbar" hidden></div>
<div id="options" class="bar options" data-testid="screenshot.options" hidden></div>
<div id="actions" class="bar actions" data-testid="screenshot.actions" hidden></div>
<div id="popover" class="bar popover" data-testid="screenshot.popover" hidden></div>
<div id="ocr" class="bar ocr" data-testid="screenshot.ocr" hidden></div>
<div id="hint" class="hint" data-testid="screenshot.hint" hidden></div>
<div id="toast" class="otoast" data-testid="screenshot.toast" hidden></div>
<textarea id="text" class="text-editor" data-testid="screenshot.text" spellcheck="false" hidden></textarea>
<script src="index.js" type="module"></script></body></html>
